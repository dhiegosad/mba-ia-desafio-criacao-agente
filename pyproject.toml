[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk==2.11.0",
    "greenlet>=3.5.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aurora = "residencial_aurora.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
